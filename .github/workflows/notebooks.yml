name: notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .binder/requirements.txt
      - name: 安装依赖（与 MyBinder 相同）
        run: pip install -r .binder/requirements.txt nbclient nbformat ipykernel
      - name: 学生版与参考答案同步
        run: python tools/make_student.py --check
      - name: 执行全部 Notebook
        run: python tools/run_notebooks.py
